<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03070d">
  <meta name="background-color" content="#03070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Floyd Show">
  <meta name="application-name" content="The Floyd Show HQ">
  <title>The Floyd Show</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=22">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png?v=22">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=22">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=22">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png?v=22">
  <link rel="shortcut icon" href="./icons/favicon.ico?v=22">
  <link rel="preload" as="image" href="./icons/icon-192.png?v=22">

  <style>
    :root {
      color-scheme: dark;
      --bg: #03070d;
      --panel: #102235;
      --text: #f4f7ff;
      --muted: #a9bad0;
      --accent: #f24ea4;
      --green: #45d667;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    #appFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    .screen {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, rgba(78,105,255,.22), transparent 34%),
        radial-gradient(circle at 82% 82%, rgba(242,78,164,.18), transparent 34%),
        var(--bg);
    }

    .screen[hidden] { display: none; }

    .card {
      width: min(100%, 430px);
      padding: 24px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 26px;
      background: rgba(15,34,53,.97);
      box-shadow: 0 28px 80px rgba(0,0,0,.52);
      text-align: center;
    }

    .logo-shell {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 32px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(74,169,255,.28), transparent 45%),
        #07131f;
      box-shadow: 0 0 34px rgba(187,85,255,.18);
    }

    .logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity .25s ease;
    }

    .logo.loaded {
      opacity: 1;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 28px;
    }

    p {
      color: var(--muted);
      line-height: 1.45;
    }

    label {
      display: grid;
      gap: 10px;
      margin-top: 20px;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      text-align: left;
    }

    select {
      width: 100%;
      min-height: 66px;
      padding: 12px 18px;
      border: 2px solid rgba(74,169,255,.42);
      border-radius: 18px;
      color: var(--text);
      background: #14334b;
      font-size: 24px;
      font-weight: 850;
    }

    button {
      width: 100%;
      min-height: 58px;
      margin-top: 18px;
      border: 0;
      border-radius: 18px;
      color: #06100a;
      background: var(--green);
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
    }

    .loader {
      width: 44px;
      height: 44px;
      margin: 24px auto 0;
      border: 4px solid rgba(255,255,255,.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .update-banner {
      position: fixed;
      z-index: 60;
      left: 14px;
      right: 14px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(74,169,255,.42);
      border-radius: 16px;
      color: var(--text);
      background: rgba(10,27,42,.98);
      box-shadow: 0 16px 48px rgba(0,0,0,.44);
    }

    .update-banner[hidden] { display: none; }

    .update-banner button {
      width: auto;
      min-height: 42px;
      margin: 0;
      padding: 8px 14px;
      font-size: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loadingScreen .logo-shell {
      animation: logoArrival 1s cubic-bezier(.2,.8,.2,1) both;
    }

    #loadingScreen .card {
      animation: cardArrival .8s ease both;
    }

    @keyframes logoArrival {
      0% {
        opacity: 0;
        transform: scale(.78);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes cardArrival {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div id="memberScreen" class="screen" hidden>
    <section class="card">
      <div class="logo-shell">
        <img class="logo app-logo" src="./icons/icon-192.png?v=22"
          alt="The Floyd Show logo">
      </div>
      <h1>Who is using The Floyd Show HQ?</h1>
      <p>Choose your name once. This device will remember you.</p>

      <label>
        Band member
        <select id="memberSelect">
          <option value="">Choose your name…</option>
          <option>Alan</option>
          <option>Josh</option>
          <option>Peter</option>
          <option>Nunzio</option>
          <option>Manny</option>
          <option>Liz</option>
          <option>Leah</option>
          <option>Mark</option>
          <option>Ian & Lea</option>
        </select>
      </label>

      <button id="continueButton" type="button">Continue</button>
    </section>
  </div>

  <div id="loadingScreen" class="screen">
    <section class="card">
      <div class="logo-shell">
        <img class="logo app-logo" src="./icons/icon-192.png?v=22"
          alt="The Floyd Show logo">
      </div>
      <h1>The Floyd Show HQ</h1>
      <p>Loading bookings, rehearsals and availability…</p>
      <div class="loader"></div>
    </section>
  </div>

  <div id="updateBanner" class="update-banner" hidden>
    <span>A new Floyd HQ update is ready.</span>
    <button id="reloadUpdateButton" type="button">Update now</button>
  </div>

  <iframe id="appFrame" title="The Floyd Show HQ"></iframe>

  <script src="./config.js?v=22"></script>
  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'theFloydShowMember';
      const memberScreen = document.getElementById('memberScreen');
      const loadingScreen = document.getElementById('loadingScreen');
      const memberSelect = document.getElementById('memberSelect');
      const continueButton = document.getElementById('continueButton');
      const appFrame = document.getElementById('appFrame');

      document.querySelectorAll('.app-logo').forEach(function(image) {
        function markLoaded() {
          image.classList.add('loaded');
        }

        if (image.complete && image.naturalWidth > 0) {
          markLoaded();
        } else {
          image.addEventListener('load', markLoaded, { once: true });
        }
      });

      function buildAppUrl(member) {
        const base = window.THE_FLOYD_SHOW_CONFIG.appsScriptUrl;
        const separator = base.includes('?') ? '&' : '?';
        return base + separator + 'member=' + encodeURIComponent(member);
      }

      function openApp(member) {
        localStorage.setItem(STORAGE_KEY, member);
        memberScreen.hidden = true;
        loadingScreen.hidden = false;
        appFrame.src = buildAppUrl(member);
      }

      const rememberedMember = localStorage.getItem(STORAGE_KEY);

      if (rememberedMember) {
        openApp(rememberedMember);
      } else {
        loadingScreen.hidden = true;
        memberScreen.hidden = false;
      }

      continueButton.addEventListener('click', function () {
        const member = memberSelect.value;
        if (!member) return;
        openApp(member);
      });

      appFrame.addEventListener('load', function () {
        window.setTimeout(function () {
          loadingScreen.hidden = true;
        }, 300);
      });

      window.addEventListener('message', function (event) {
        if (
          event.data &&
          event.data.type === 'the-floyd-show-member' &&
          event.data.member
        ) {
          localStorage.setItem(STORAGE_KEY, event.data.member);
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js?v=22').then(function(registration) {
            function showUpdate(worker) {
              const banner = document.getElementById('updateBanner');
              const reloadButton = document.getElementById('reloadUpdateButton');
              if (!banner || !reloadButton || !worker) return;

              banner.hidden = false;
              reloadButton.onclick = function() {
                worker.postMessage({ type: 'SKIP_WAITING' });
              };
            }

            if (registration.waiting) {
              showUpdate(registration.waiting);
            }

            registration.addEventListener('updatefound', function() {
              const worker = registration.installing;
              if (!worker) return;

              worker.addEventListener('statechange', function() {
                if (
                  worker.state === 'installed' &&
                  navigator.serviceWorker.controller
                ) {
                  showUpdate(worker);
                }
              });
            });
          });

          navigator.serviceWorker.addEventListener(
            'controllerchange',
            function() {
              window.location.reload();
            }
          );
        });
      }
    }());
  </script>
</body>
</html>
